<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{THEME_COLOR}}" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="{{THEME_COLOR_DARK}}" media="(prefers-color-scheme: dark)">

<title>{{APP_NAME}}</title>
<meta name="description" content="{{APP_DESCRIPTION}}">

<!-- Open Graph / tarjeta al compartir -->
<meta property="og:title" content="{{APP_NAME}}">
<meta property="og:description" content="{{APP_DESCRIPTION}}">
<meta property="og:image" content="{{APP_URL}}/assets/og.png">
<meta property="og:url" content="{{APP_URL}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="update-toast" id="updateToast">
  <span>Hay una versión nueva disponible.</span>
  <button id="updateBtn">Actualizar</button>
</div>

<div class="install-banner" id="installBanner">
  <p id="installText">Instala {{APP_NAME}} en tu móvil para acceder sin conexión.</p>
  <button id="installBtn">Instalar</button>
  <button class="install-dismiss" id="installDismiss">Ahora no</button>
</div>

<header class="site-header">
  <div class="header-inner">
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{APP_TITLE}}</h1>
    <p class="dates">{{SUBTITLE}}</p>
  </div>
</header>

<nav class="view-switch" id="viewSwitch">
  <button class="view-btn is-active" data-view="lugares">Todos</button>
  <button class="view-btn" data-view="itinerario">Itinerario</button>
  <button class="view-btn" data-view="mapa">Mapa</button>
  <button class="view-btn" data-view="info">Info</button>
</nav>

<div class="now-banner" id="nowBanner"></div>

<main id="app">

  <section id="view-lugares" class="view is-active">
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="Buscar lugar..." autocomplete="off">
      <button class="star-toggle" id="starToggle" title="Solo imprescindibles">★</button>
      <span class="progress-badge" id="progressBadge"></span>
    </div>
    <div class="filter-row" id="lugaresFilters"></div>
    <div class="places-grid" id="lugaresGrid"></div>
  </section>

  <section id="view-itinerario" class="view">
    <div class="day-tabs" id="dayTabs"></div>
    <div class="milestone-track" id="itinerarioContent"></div>
  </section>

  <section id="view-mapa" class="view">
    <div class="filter-row" id="mapFilters"></div>
    <div id="map"></div>
  </section>

  <section id="view-info" class="view">
    <div class="info-content" id="infoContent"></div>
  </section>

</main>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="core/pullToRefresh.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
